version: 2
updates:
  - package-ecosystem: npm
    directory: /
    commit-message:
      prefix: build(deps)
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # types must track the Node 22 runtime
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: build(deps)
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
