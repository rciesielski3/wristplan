version: 2
updates:
  - package-ecosystem: npm
    directory: /
    commit-message:
      prefix: build(deps)
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: build(deps)
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
